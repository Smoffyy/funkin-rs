name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Build
        run: cargo build --release

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/funkin-rs | Out-Null
          Copy-Item target/release/funkin-rs.exe, assets, content -Destination dist/funkin-rs -Recurse
          Compress-Archive -Path dist/funkin-rs -DestinationPath funkin-rs-windows.zip

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/funkin-rs
          cp target/release/funkin-rs dist/funkin-rs/
          cp -R assets content dist/funkin-rs/
          (cd dist && zip -r ../funkin-rs-macos.zip funkin-rs)

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/funkin-rs
          cp target/release/funkin-rs dist/funkin-rs/
          cp -R assets content dist/funkin-rs/
          tar -czf funkin-rs-linux.tar.gz -C dist funkin-rs

      - uses: actions/upload-artifact@v4
        with:
          name: funkin-rs-${{ matrix.target }}
          path: funkin-rs-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 {found = 1; next} /^## \[/ {found = 0} found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG.md entry for version $VERSION"
            exit 1
          fi
          cat >> notes.md <<'EOF'

          ---

          Windows: unzip and run funkin-rs.exe.

          macOS: unzip and right-click funkin-rs, then choose Open the first time. The build is not signed.

          Linux: extract the archive and run ./funkin-rs.
          EOF

      - uses: actions/download-artifact@v4
        with:
          pattern: funkin-rs-*
          merge-multiple: true
          path: release

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: v${{ steps.version.outputs.version }}
          name: Friday Night Funkin' v${{ steps.version.outputs.version }}
          body_path: notes.md
          files: release/*