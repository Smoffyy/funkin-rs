[package]
name = "funkin-rs"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
miniquad = "0.4.11"
image = { version = "0.25.10", default-features = false, features = ["png"] }
fontdue = "0.9.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
kira = { version = "0.12.5", default-features = false, features = ["cpal", "ogg", "vorbis"] }

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
[profile.dev]
opt-level = 1